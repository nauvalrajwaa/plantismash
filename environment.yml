name: plantismash
channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  - python=3.8
  # NOTE (Apple Silicon / osx-arm64): several pins below have no arm64 builds.
  # On M-series Macs create the env under Rosetta instead:
  #   CONDA_SUBDIR=osx-64 mamba env create -f environment.yml
  - glimmer=3.02
  - glimmerhmm=3.0.4
  - hmmer=3.3.2
  - bioconda/label/cf201901::hmmer2
  - fasttree=2.1.11       
  - diamond=2.0.15
  - muscle=3.8.31
  - prodigal=2.6.3     
  - blast=2.12.0
  - cd-hit=4.8.1
  - libxml2=2.10.3
  - pplacer=1.1.alpha17
  - ncbi-datasets-cli=18.9.0
  - unzip=6.0
 # Extras for TFBS and visualization
  - logomaker=0.8
  - pytest=8.3.4
  # Pip dependencies
  - pip
  - pip:
      # Install THIS repository (editable) - brings pinned pure-python deps
      # from pyproject.toml: biopython==1.76, bcbio-gff==0.6.7, straight.plugin, etc.
      # MOODS-python is OPTIONAL now: pip install -e .[tfbs] to add it if the C
      # extension builds on your toolchain; tfbs_finder falls back without it.
      # Do NOT install the PyPI 'plantismash' package here - it would shadow
      # this fork's code.
      - -e .
      - ./graphlan
     

